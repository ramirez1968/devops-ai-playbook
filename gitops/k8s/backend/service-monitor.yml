apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: boutique-services
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - boutique
  # Every backend service exposes /metrics on its "http" port.
  # (The frontend is static files and has no /metrics.)
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - gateway
          - auth
          - product-service
          - order-service
          - orders
          - user-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
