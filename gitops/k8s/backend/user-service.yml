apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: 871313051482.dkr.ecr.us-east-1.amazonaws.com/user-service:d921a0049dc40bd4178578f03ea8020b26d5a9a6
          ports:
            - containerPort: 3006
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: NODE_ENV
              value: development
            - name: PORT
              value: "3006"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: boutique-secrets
                  key: AUTH_DB_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: boutique-jwt
                  key: JWT_SECRET

--- 

apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: boutique
  labels:
    app: user-service
spec:
  selector:
    app: user-service
  ports:
    - name: http
      protocol: TCP
      port: 3006
      targetPort: 3006
  type: ClusterIP
